# Render Blueprint: New > Blueprint > pick this repo.
# Fallback deployment target.
services:
  - type: web
    name: vridhasuraksha
    env: node
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: prisma
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: VridhaSuraksha <onboarding@resend.dev>
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
